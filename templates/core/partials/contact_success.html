{% load static %}
<div id="contact-form-container" class="bg-green-950/40 border border-green-600/60 rounded-lg p-8 text-center animate-fade-in">
    <div class="w-16 h-16 bg-green-600/20 rounded-full flex items-center justify-center mx-auto mb-4 border border-green-500/40">
        <i class="fas fa-check text-green-400 text-3xl"></i>
    </div>
    <h3 class="font-display text-2xl font-bold text-white mb-2 tracking-wide">¡Mensaje Enviado!</h3>
    <p class="text-gray-300 mb-6 max-w-md mx-auto">Gracias por contactar. Te responderé a la mayor brevedad posible para coordinar tu entrenamiento.</p>
    <button hx-get="{% url 'core:contact_form' %}" 
            hx-target="#contact-form-container" 
            hx-swap="outerHTML" 
            class="text-red-400 hover:text-white transition cursor-pointer text-sm font-display uppercase tracking-wider inline-flex items-center gap-2">
        <i class="fas fa-redo-alt text-xs"></i> Enviar otro mensaje
    </button>
</div>
