upstream adrian_app {
    server unix:/run/adrian/adrian.sock fail_timeout=0;
}

server {
    listen 80;
    server_name adrigalvez.com www.adrigalvez.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name adrigalvez.com www.adrigalvez.com;

    ssl_certificate     /etc/letsencrypt/live/adrigalvez.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adrigalvez.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    location /static/ {
        alias /home/adrian/adrian/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /home/adrian/adrian/media/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://adrian_app;
    }
}
