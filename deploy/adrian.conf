# Zona de limitación de peticiones para proteger el login del admin (5 intentos/min por IP)
limit_req_zone $binary_remote_addr zone=admin_login_limit:10m rate=5r/m;
# Zona de limitación de peticiones para el formulario de contacto público (5 envíos/min por IP)
limit_req_zone $binary_remote_addr zone=contact_limit:10m rate=5r/m;

upstream adrian_app {
    server unix:/run/adrian/adrian.sock fail_timeout=0;
}

server {
    listen 80;
    server_name adrian.srvdebian www.adrian.srvdebian adrianadmin.srvdebian localhost;

    # Logs detallados de Nginx para diagnosticar errores y monitorizar tráfico
    access_log /var/log/nginx/adrian_access.log;
    error_log /var/log/nginx/adrian_error.log warn;

    client_max_body_size 20M;

    # Cabeceras de seguridad globales (en producción HTTPS añadir HSTS)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), focus-without-user-activation=()" always;
    # En bloque HTTPS (443):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Archivos estáticos de Django
    location /static/ {
        alias /home/kike/proyectos/adrianmma/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Archivos multimedia subidos por usuarios/admin
    location /media/ {
        alias /home/kike/proyectos/adrianmma/media/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Limitación de tasa en la ruta de login del subdominio de administración
    location = /login/ {
        limit_req zone=admin_login_limit burst=3 nodelay;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_pass http://adrian_app;
    }

    # Limitación de tasa en el endpoint del formulario de contacto
    location = /contacto/ {
        limit_req zone=contact_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_pass http://adrian_app;
    }

    # Proxy inverso a Gunicorn mediante socket UNIX
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Conectar al upstream 'adrian_app' definido arriba
        proxy_pass http://adrian_app;
    }
}
