upstream adrian_app {
    server unix:/run/adrian/adrian.sock fail_timeout=0;
}

server {
    listen 80;
    server_name adrian.srvdebian www.adrian.srvdebian localhost;

    # Logs detallados de Nginx para diagnosticar errores y monitorizar tráfico
    access_log /var/log/nginx/adrian_access.log;
    error_log /var/log/nginx/adrian_error.log warn;

    client_max_body_size 20M;

    # Archivos estáticos de Django
    location /static/ {
        alias /home/kike/proyectos/adrianmma/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Archivos multimedia subidos por usuarios/admin
    location /media/ {
        alias /home/kike/proyectos/adrianmma/media/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy inverso a Gunicorn mediante socket UNIX
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Conectar al upstream 'adrian_app' definido arriba
        proxy_pass http://adrian_app;
    }
}
